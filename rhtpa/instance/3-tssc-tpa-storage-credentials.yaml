#  S3 storage credentials
apiVersion: v1
kind: Secret
metadata:
  name: storage-credentials
  namespace: trusted-profile-analyzer
type: Opaque
data:
  # ATUALIZAR - from bucket secret - tssc-tpa-bucket.AWS_ACCESS_KEY_ID
  user: ${TPA_BUCKET_ACCESS_KEY}
  # ATUALIZAR - from bucket secret - tssc-tpa-bucket.AWS_SECRET_ACCESS_KEY
  password: ${TPA_BUCKET_SECRET}