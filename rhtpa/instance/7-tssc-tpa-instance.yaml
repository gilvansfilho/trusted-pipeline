apiVersion: rhtpa.io/v1
kind: TrustedProfileAnalyzer
metadata:
  name: tssc-tpa
  namespace: trusted-profile-analyzer
spec:
  tracing:
    enabled: false
  metrics:
    enabled: false
  infrastructure:
    port: 9010
  # AJUSTAR - precisa ajustar com o dominio do cluster do cliente
  appDomain: -tssc-tpa.${CLUSTER_DOMAIN}
  modules:
    createDatabase:
      enabled: true
    createImporters:
      enabled: true
      importers:
        redhat-sboms:
          sbom:
            description: All Red Hat SBOMs
            period: 1d
            source: https://access.redhat.com/security/data/sbom/beta/
            keys:
              - https://access.redhat.com/security/data/97f5eac4.txt#77E79ABE93673533ED09EBE2DCE3823597F5EAC4
            disabled: true
            fetchRetries: 50
        redhat-csaf:
          csaf:
            description: All Red Hat CSAF data
            period: 1d
            source: redhat.com
            disabled: true
            fetchRetries: 50
        cve:
          cve:
            description: CVE list v5
            period: 1d
            source: https://github.com/CVEProject/cvelistV5
            disabled: false
        osv-github:
          osv:
            description: GitHub Advisory Database
            period: 1d
            source: https://github.com/github/advisory-database
            path: advisories
            disabled: false
        quay-redhat-user-workloads:
          quay:
            description: SBOMs from build image attachments
            period: 1d
            source: quay.io
            namespace: redhat-user-workloads
            disabled: true
    importer:
      enabled: true
      tracing: {}
      metrics: {}
      infrastructure: {}
      rust: {}
      resources:
        requests:
          cpu: 1
          memory: 8Gi
      concurrency: 1
      image: {}
      replicas: 1
      workingDirectory:
        size: 45Gi
    migrateDatabase:
      enabled: true
    server:
      enabled: true
      tracing: {}
      metrics: {}
      infrastructure: {}
      rust:
        logFilter: info
      resources:
        requests:
          cpu: 4
          memory: 8Gi
      ingress: {}
      image: {}
      replicas: 1
  partOf: trustify
  collector: {}
  ingress:
    className: openshift-default
    additionalAnnotations:
      "haproxy.router.openshift.io/timeout": "5m"
  openshift:
    useServiceCa: true
  oidc:
    # AJUSTAR - CLUSTER DOMAIN e REALM DO RHTPA
    issuerUrl: https://tssc-rhbk.${CLUSTER_DOMAIN}/realms/tssc-tpa
    uiScope: openid
    loadUser: true
    clients:
      frontend:
        # client id - frontend
        clientId: tssc-tpa-frontend
      cli:
        # client id - cli
        clientId: tssc-tpa-cli
        clientSecret:
          valueFrom:
            secretKeyRef:
              name: oidc-cli
              key: client-secret
  tls: {}
  image: {}

  database:
    sslMode: disable
    host:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.host
    port:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.port
    name:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.name
    username:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.user
    password:
      valueFrom:
        secretKeyRef:
          name: postgresql-credentials
          key: db.password

  createDatabase:
    name:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.name
    username:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.user
    password:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.password

  migrateDatabase:
    username:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.user
    password:
      valueFrom:
        secretKeyRef:
          name: postgresql-admin-credentials
          key: db.password

  storage:
    type: s3
    # from bucket config map - bucket host
    region: "https://${TPA_BUCKET_HOST}.${CLUSTER_DOMAIN}:${TPA_BUCKET_PORT}"
    # from bucket config map - bucket name
    bucket: ${TPA_BUCKET_NAME}
    accessKey:
      valueFrom:
        secretKeyRef:
          name: storage-credentials
          key: user
    secretKey:
      valueFrom:
        secretKeyRef:
          name: storage-credentials
          key: password
  replicas: 1
